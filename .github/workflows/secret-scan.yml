name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # This repository is public. A GitHub-hosted runner is necessary, because a
    # self-hosted runner would run code from pull requests that forks open.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The official gitleaks image from the GitHub Container Registry, pinned by
      # the digest of the v8.30.0 image index. Thus the scan does not depend on
      # GitHub release downloads, which failed with HTTP 504 on 2026-11-09. The
      # container runs as the runner user, so git accepts the checkout.
      - name: Scan the full git history
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --verbose --no-banner
