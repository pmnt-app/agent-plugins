name: Gitleaks Check

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # run once a day at 4 AM

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    # The other pmnt-app repos use pmnt-app-runners. This repository is public,
    # so it uses a GitHub-hosted runner: a self-hosted runner must not run
    # workflows of a public repository.
    runs-on: ubuntu-latest
    steps:
      # Full commit SHAs, because this repository requires pinned actions.
      # Dependabot updates both pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
